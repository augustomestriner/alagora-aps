server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Resolve o nome "api" pelo DNS do Docker a cada 5 s, em vez de só na partida. O nome
  # devolve o endereço de todas as réplicas da API: o Nginx alterna entre elas (round-robin)
  # e, se uma não responder, tenta a próxima (só para pedidos que podem ser repetidos com segurança).
  # Também sobe mesmo se a API ainda não existir e reencontra réplicas recriadas.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:3000;
  # Tempo real (SSE): conexão longa e sem buffer para os eventos chegarem na hora.
  location = /api/events {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
  }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
